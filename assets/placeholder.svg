      <stop offset="0" stop-color="#151517"/><stop offset="1" stop-color="#0b0b0c"/>
    </linearGradient>
    <pattern id="pgrid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
