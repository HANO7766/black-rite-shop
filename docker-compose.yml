name: black-rite-shop

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: black-rite-shop:1.0.0
    container_name: black-rite-shop
    restart: unless-stopped
    init: true
    ports:
      - "${BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:8080"
    environment:
      TZ: "${TZ:-America/Santiago}"
      PORT: "8080"
      HOST: "0.0.0.0"
      DB_PATH: "/data/shop.db"
    volumes:
      - shop_data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 10s
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/').then((r) => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  shop_data:
    name: black-rite-shop-data
